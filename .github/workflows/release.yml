name: Release

# Publishes form-extract to PyPI with Trusted Publishing (no tokens). Tag vX.Y.Z to release.
# A tag containing "rc" (e.g. v0.1.0rc1) goes to TestPyPI instead; use that first. The tag
# must equal the version in pyproject.toml. PyPI releases are permanent.
#
# One-time setup (docs/releasing.md): a pending publisher for form-extract on PyPI and
# TestPyPI naming this repository, this workflow file and the matching environment.

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$v" != "$tag" ]; then echo "::error::pyproject version $v does not match tag $tag"; exit 1; fi
      - run: python -m pip install build twine
      - run: python -m build --outdir dist .
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ contains(github.ref_name, 'rc') && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ contains(github.ref_name, 'rc') && 'https://test.pypi.org/legacy/' || '' }}
