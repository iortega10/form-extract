[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "form-extract"
version = "0.1.0"
description = "Structured field extraction from non-uniform document forms"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
formextract-eval = "formextract.evals.harness:main"

[tool.setuptools.packages.find]
include = ["formextract*"]

[tool.setuptools.package-data]
formextract = ["evals/manifests/*.json", "evals/manifests/fixtures/*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
