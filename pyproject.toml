[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "form-extract"
version = "0.6.0rc1"
description = "Structured field extraction from non-uniform document forms"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
authors = [{name = "Ivan Ortega"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "openpyxl>=3.1",
]

[project.urls]
Homepage = "https://github.com/iortega10/form-extract"
Source = "https://github.com/iortega10/form-extract"
Issues = "https://github.com/iortega10/form-extract/issues"

[project.optional-dependencies]
pdf = ["pymupdf>=1.24"]
dev = ["pytest>=8", "pymupdf>=1.24"]

[project.scripts]
formextract-eval = "formextract.evals.harness:main"

[tool.setuptools.packages.find]
include = ["formextract*"]

[tool.setuptools.package-data]
# Only the synthetic manifest ships. real_samples.json and its PDF describe a real third-party form
# and stay out of every distribution.
formextract = ["evals/manifests/spec_fragment.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
